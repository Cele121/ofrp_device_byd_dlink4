name: OrangeFox Build - BYD DiLink4 (dilink4)

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 14.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: 'https://github.com/Cele121/ofrp_device_byd_dlink4'
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/byd/dilink4'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'dilink4'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      MAGISK_VERSION:
        description: 'Specify your Magisk Version'
        required: true
        default: 'Magisk'
        type: choice
        options:
        - Magisk
        - MagiskAlpha
        - MagiskDelta
      ADD_WLAN_SUPPORT:
        description: 'Add WLAN support (EXPERIMENTAL!!)'
        type: boolean
        required: true
        default: false
      USE_CCACHE:
        description: Use ccache for compilation
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Build Environment
      run: |
        # linux-modules-extra 在 7.x-azure runner 上不存在，改成尽力而为
        sudo apt install aria2 zram-tools -y
        sudo apt install linux-modules-extra-$(uname -r) -y || echo "::warning::linux-modules-extra not available for $(uname -r), continuing"
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
        cd .. && rm -rf scripts
        # Redendent apt cleanup
        sudo apt autoclean >/dev/null || true
        sudo apt autoremove -qy 2>/dev/null || true
        sudo rm -rf /var/cache/apt/archives/ 2>/dev/null || true

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: '3072'

    - name: Checkout
      uses: actions/checkout@main

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        max-size: "2G"
        create-symlink: true

    - name: Setup zram
      run: |
        sudo modprobe zram || echo "::warning::zram module unavailable, skipping"
        if ! lsmod | grep -q '^zram'; then echo "no zram, continue without it"; exit 0; fi
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Set-up Manifest
      if: inputs.MANIFEST_BRANCH == '12.1' || inputs.MANIFEST_BRANCH == '14.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Android13+ Dependencies For 12.1 Branch
      if: inputs.MANIFEST_BRANCH == '12.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        sed -i 's/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-19.1-caf" \/>/<project name="android_hardware_qcom_bootctrl" path="hardware\/qcom-caf\/bootctrl" remote="LineageOS" revision="lineage-21.0-caf" \/>/g' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
        sed -i '/<!-- Include phh'\''s treble repo for lptools support -->/i \    <!-- Include libmicrohttpd for TWRP -->\n    <project name="adontoo/android_external_libmicrohttpd" path="external/libmicrohttpd" remote="github" revision="ofox-14.1" />\n' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
        sed -i '/<project path="bootable\/recovery" name="android_bootable_recovery" remote="TeamWin" revision="android-12.1"\/>/d' ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/.repo/manifests/twrp-default.xml
        mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp
        repo sync
        mv ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery-ofrp ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bionic/
        wget "https://github.com/adontoo/OrangeFox-android_platform_bionic/commit/85b1a7100083006927376f30bb8a67885c6dd71f.patch" -O bionic.patch
        git am bionic.patch
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/external/libmicrohttpd
        sed -i 's/^static enum MHD_Result send_response/static enum MHD_Result __attribute__((unused)) send_response/' server.c

    - name: Patching the Source Code For 12.1 Branch
      if: inputs.MANIFEST_BRANCH == '12.1'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        git config user.email "ci@local" && git config user.name "ci"
        git remote remove ymdzq 2>/dev/null || true
        git remote add ymdzq https://github.com/ymdzq/OrangeFox_Recovery
        git fetch ymdzq fox_12.1
        # 该分支提供中文汉化与挂载修复；上游已分叉，冲突按类型处理：
        #   *.xml -> 取对方（汉化/主题修正在这里）
        #   *.cpp/*.h* -> 保留上游（分区逻辑用最新版，不吃旧 fork）
        if ! git merge --no-ff ymdzq/fox_12.1 -m "Apply custom patches"; then
          echo "::warning::merge conflicts detected, resolving by file type"
          git checkout --theirs -- '*.xml' 2>/dev/null || true
          git checkout --ours   -- '*.cpp' '*.hpp' '*.h' 2>/dev/null || true
          git ls-files -u | awk '{print $4}' | sort -u | while read -r f; do
            [ -z "$f" ] && continue
            git checkout --theirs -- "$f" 2>/dev/null || git checkout ymdzq/fox_12.1 -- "$f" 2>/dev/null || git rm -q --cached --ignore-unmatch "$f" || true
          done
          git add -A
          git commit -m "Apply custom patches (xml=theirs, cpp=ours)" || true
        fi
        # ofrp 汉化 fork 删掉了 landscape_hdpi 主题（它只做竖屏机），但本车是 1920x1080 横屏。
        # 从同分支的官方源恢复该主题目录。
        git fetch --depth=1 https://github.com/TeamWin/android_bootable_recovery android-12.1
        git checkout FETCH_HEAD -- gui/theme/landscape_hdpi
        git add gui/theme/landscape_hdpi
        # ui.xml 里有 <include><xmlfile name="landscape.xml"/></include>
        # 而该文件在 gui/theme/common/ 下, 同样被 fork 删掉了。
        # 不补它 -> 镜像里 /twres/landscape.xml 缺失 -> 界面加载不出页面。
        git checkout FETCH_HEAD -- gui/theme/common/landscape.xml
        git add gui/theme/common/landscape.xml
        # ui.xml 还引用 DroidSansMono.ttf 与 RobotoCondensed-Regular.ttf。
        # fork 把 common/fonts 整个换成了自己的 Fox 字体集(FiraCode/Exo2/...),
        # 这两个官方字体不存在 -> TWRP 加载字体失败 -> 文字渲染不出来(只有图没有字)。
        git checkout FETCH_HEAD -- gui/theme/common/fonts/DroidSansMono.ttf
        git checkout FETCH_HEAD -- gui/theme/common/fonts/RobotoCondensed-Regular.ttf
        git add gui/theme/common/fonts
        git commit -m "restore landscape_hdpi + common/landscape.xml (dropped by ofrp fork)" || true
        for f in gui/theme/landscape_hdpi/ui.xml gui/theme/common/landscape.xml \
                 gui/theme/common/fonts/DroidSansMono.ttf \
                 gui/theme/common/fonts/RobotoCondensed-Regular.ttf; do
          if [ ! -f "$f" ]; then echo "::error::missing $f"; exit 1; fi
        done
        echo "restored: landscape_hdpi $(find gui/theme/landscape_hdpi -type f | wc -l) files, common/landscape.xml $(wc -c < gui/theme/common/landscape.xml) bytes"
        echo "landscape theme restored: $(wc -c < gui/theme/landscape_hdpi/ui.xml) bytes, $(find gui/theme/landscape_hdpi -type f | wc -l) files"
        # 校验：不允许残留冲突标记
        if grep -rIl -E '^(<<<<<<< |>>>>>>> )' --include='*.cpp' --include='*.h' --include='*.hpp' --include='*.xml' . ; then
          echo "::error::conflict markers still present"; exit 1
        fi
        # ---- 单缓冲补丁: 消除 DRM 平面翻转导致的黑帧闪烁 ----
        # minuitwrp/graphics_drm.cpp 的 drm_flip() 每帧在两块 dumb buffer 间切换:
        #     current_buffer = 1 - current_buffer;
        # 这块 lito 面板对该翻转处理不好 -> 界面黑一帧亮一帧 (实测 v19/v21/v23 均如此)。
        # 改为永远使用 buffer 0 (单缓冲), 不再翻转。
        DRMCPP=minuitwrp/graphics_drm.cpp
        if [ -f "$DRMCPP" ]; then
          sed -i 's/^    current_buffer = 1 - current_buffer;/    current_buffer = 0; \/* single-buffer patch: avoid flip black frames *\//' "$DRMCPP"
          echo "--- 单缓冲补丁后的 drm_flip ---"
          grep -A5 "^static GRSurface\* drm_flip" "$DRMCPP" | head -8
          grep -q "single-buffer patch" "$DRMCPP" || { echo "::error::drm single-buffer patch failed"; exit 1; }
        else
          echo "::error::$DRMCPP not found"; exit 1
        fi
        # ---- 修 SAR 下 vendor 目录冲突 ----
        # TWRP 的 bootable/recovery/prebuilt/Android.mk 会生成真实的
        #   recovery/root/vendor/bin/hw  (HAL 二进制, recovery 必需)
        # 而 AOSP 的 build-recoveryimage-target 用
        #   rsync -a --exclude=sdcard $(TARGET_ROOT_OUT) $(TARGET_RECOVERY_OUT)
        # 把源 root/vendor(符号链接, 指向 /system/vendor) 同步过去,
        # 遇到非空真实目录无法覆盖 -> code 23, 构建在 99% 中断 (run#7/#8 实测)。
        # AOSP 那行没有可配变量, 直接补 --exclude=root/vendor 保留真实目录。
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        sed -i 's|--exclude=sdcard |--exclude=sdcard --exclude=root/vendor |g' build/make/core/Makefile
        echo "--- rsync 行已打补丁 ---"
        grep -n 'exclude=root/vendor' build/make/core/Makefile
        test $(grep -c 'exclude=root/vendor' build/make/core/Makefile) -ge 1 || { echo "::error::rsync patch failed"; exit 1; }
        # ---- 4.19 内核 functionfs 空指针崩溃 -> 摘掉 init.rc 里两处 mount ----
        # 实测 ffs_fs_mount() 会写 NULL+0x150, 崩 PID 1 -> kernel panic, recovery 起不来。
        # 原厂/移植版都用 "# [byd]" 注释掉这两行, 这里做同样处理。
        # 真正生效的 recovery init.rc 是 bootable/recovery/etc/init.rc
        # (AOSP 的 system/core/rootdir/init.rc 里根本没有这两行 — run#13 实测证明改那个无效)
        for INITRC in bootable/recovery/etc/init.rc system/core/rootdir/init.rc; do
          [ -f "$INITRC" ] || continue
          sed -i -E 's|^([[:space:]]*)mount functionfs |\1# [byd] mount functionfs |' $INITRC
          echo "--- $INITRC ---"
          grep -n "functionfs" $INITRC || true
          if grep -qE '^[[:space:]]*mount functionfs' $INITRC; then
            echo "::error::functionfs still active in $INITRC"; exit 1
          fi
        done
        # ---- 诊断钩子: 启动 25 秒后把 TWRP 日志写到 /data ----
        # 车机 USB 只有 host 模式, recovery 里拿不到 adb/网络, 只能靠这个把日志带出来。
        LOGHOOK=bootable/recovery/etc/init.rc
        if ! grep -q "twrp_log_dump" $LOGHOOK; then
          printf '%s\n' '' '# twrp_log_dump: dump recovery log + dmesg to /data for diagnostics' 'on late-init' '    exec - root -- /system/bin/sh -c "sleep 25; cp /tmp/recovery.log /data/media/0/twrp_boot.log 2>/dev/null; dmesg > /data/media/0/twrp_dmesg.txt 2>/dev/null; getprop > /data/media/0/twrp_props.txt 2>/dev/null"' >> $LOGHOOK
          echo "log hook appended"
        fi
        echo "log hook lines: $(grep -c twrp_log_dump $LOGHOOK)"
        echo "patch step OK: $(git log --oneline -1)"

    - name: Add WLAN support For 14.1 Branch
      if: inputs.MANIFEST_BRANCH == '14.1' && inputs.ADD_WLAN_SUPPORT
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/bootable/recovery
        wget "https://github.com/adontoo/device_xiaomi_sm8750_OFRP/raw/refs/heads/fox_14.1/patches/ofox_bootable_recovery.patch" -O wlan.patch
        git apply wlan.patch
        wget "https://github.com/ymdzq/OrangeFox_Recovery/commit/55743730c43681a777c4eacddd9d64a84dce3a54.patch" -O wlan2.patch
        git apply wlan2.patch

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        # ---- 用设备树里的 v6 主题(1920x1080)覆盖上游 1920x1200 版本 ----
        # 上游 landscape_hdpi 声明 1920x1200, 本车屏幕 1920x1080,
        # TWRP 会按 scale_h=0.9 逐帧缩放 -> 实测界面闪烁卡死。
        # 设备树在此步骤之前已克隆, 所以放在这里而不是 Patching 步骤。
        DT="${{ inputs.DEVICE_PATH }}"
        # 不再覆盖: 源码树自带的 TeamWin 12.1 主题与本二进制同源, 页面齐全
        # (实测 v6 主题导致 "Unable to locate page (main)" + SIGSEGV 崩溃循环)
        echo "keep upstream theme (TeamWin 12.1)"
        echo "--- 主题分辨率校验 ---"
        grep -o '<resolution width="[0-9]*" height="[0-9]*"/>' bootable/recovery/gui/theme/landscape_hdpi/ui.xml | head -1
        grep -o '<resolution width="[0-9]*" height="[0-9]*"/>' bootable/recovery/gui/theme/landscape_hdpi/ui.xml | head -1
        echo "theme ok: $(wc -c < bootable/recovery/gui/theme/common/landscape.xml) bytes landscape.xml"
        set +e
        export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        if [[ ${{ inputs.USE_CCACHE }} == true ]]; then
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        fi
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        if [[ ${{ inputs.MANIFEST_BRANCH }} == '14.1' ]]; then
        lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        else
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image
        fi

    - name: Verify recovery image exists
      run: |
        set -e
        OUT=OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}
        echo "--- $OUT ---"; ls -l "$OUT" | head -40 || true
        if ! ls "$OUT"/OrangeFox*.img >/dev/null 2>&1; then
          echo "::error::recovery image NOT produced - OFRP packaged an empty zip. Check BUILDING_RECOVERY_IMAGE."
          exit 1
        fi
        md5sum "$OUT"/OrangeFox*.img
        stat -c '%n %s bytes' "$OUT"/OrangeFox*.img

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          
